name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Remoter.slnx

      - name: Build
        run: dotnet build Remoter.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Remoter.slnx -c Release --no-build
